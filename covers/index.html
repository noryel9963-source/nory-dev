<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Cover Studio</title>
<style>
  @font-face { font-family: "Cinzel"; font-weight: 500; src: url("fonts/Cinzel-Medium.ttf") format("truetype"); }
  @font-face { font-family: "Cinzel"; font-weight: 700; src: url("fonts/Cinzel-Bold.ttf") format("truetype"); }
  @font-face { font-family: "Pinyon Script"; src: url("fonts/PinyonScript-Regular.ttf") format("truetype"); }

  :root {
    --bg: #0f1424;
    --panel: #182036;
    --text: #e9e4d8;
    --muted: #9aa3b8;
    --accent: #e0893a;
    --line: #2a3350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header, main { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); }

  form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
  }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, textarea {
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  textarea { resize: vertical; min-height: 84px; }
  button {
    font: inherit;
    font-weight: 600;
    color: #1a0e04;
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 10px 14px;
    cursor: pointer;
    align-self: end;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 24px;
  }
  figure { margin: 0; }
  figure canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
  figcaption {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 14px;
  }
  figcaption a { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }

  /* ?solo=N renders a single full-size cover (used for PNG export / screenshots) */
  body.solo header, body.solo form { display: none; }
  body.solo main { padding: 0; max-width: none; }
  body.solo .gallery { display: block; }
  body.solo figure canvas { width: 836px; border-radius: 0; box-shadow: none; }
  body.solo figcaption { display: none; }
</style>
</head>
<body>
<header>
  <h1>Book Cover Studio</h1>
  <p>Cosmic sunburst and lava-field book covers, drawn entirely in code. Edit the fields and download each cover as a PNG.</p>
</header>

<main>
  <form id="editor">
    <label>Title lines (one per line)
      <textarea id="f-title">ASRIN
GETİRDİĞİ
TEREDDÜTLER</textarea>
    </label>
    <label>Author
      <input id="f-author" value="M. Fethullah Gülen">
    </label>
    <label>Volumes (comma separated, blank for none)
      <input id="f-volumes" value="1, 2, 3, 4">
    </label>
    <button type="submit">Render covers</button>
  </form>

  <section class="gallery" id="gallery"></section>
</main>

<script>
(() => {
  const W = 836, H = 1244;          // cover size in px (same ratio as the original)
  const BAND = 1060;                // y where the bottom author/volume band starts
  const SUN = { x: 350, y: 330 };
  const YH = 400;                   // perspective horizon of the lava field

  // ---------- seeded noise ----------
  function makeNoise(seed) {
    const hash = (i, j) => {
      let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(seed, 1442695041)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      h ^= h >>> 16;
      return (h >>> 0) / 4294967295;
    };
    const noise = (x, y) => {
      const i = Math.floor(x), j = Math.floor(y);
      const fx = x - i, fy = y - j;
      const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
      const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
      return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
    };
    const fbm = (x, y, oct = 5) => {
      let s = 0, a = 0.5, f = 1, n = 0;
      for (let o = 0; o < oct; o++) { s += a * noise(x * f, y * f); n += a; a *= 0.5; f *= 2.03; }
      return s / n;
    };
    // Voronoi: distance to nearest / second-nearest feature point
    const voronoi = (x, y) => {
      const ci = Math.floor(x), cj = Math.floor(y);
      let d1 = 9, d2 = 9, id = 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        const gi = ci + i, gj = cj + j;
        const px = gi + 0.15 + 0.7 * hash(gi, gj);
        const py = gj + 0.15 + 0.7 * hash(gi + 71, gj + 13);
        const d = Math.hypot(px - x, py - y);
        if (d < d1) { d2 = d1; d1 = d; id = hash(gi + 3, gj + 5); }
        else if (d < d2) d2 = d;
      }
      return [d1, d2, id];
    };
    return { hash, noise, fbm, voronoi };
  }

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  const gauss = (x, y, cx, cy, r) => Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (2 * r * r));
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  function skyBase(y) {
    const stops = [[0, [5, 5, 14]], [220, [22, 8, 16]], [430, [56, 24, 24]], [620, [58, 44, 46]]];
    for (let k = 1; k < stops.length; k++) {
      if (y <= stops[k][0]) {
        const [y0, c0] = stops[k - 1], [y1, c1] = stops[k];
        return mix(c0, c1, (y - y0) / (y1 - y0));
      }
    }
    return stops[stops.length - 1][1];
  }

  // ---------- the painted artwork (everything above the band) ----------
  function paintArt(seed = 7) {
    const N = makeNoise(seed);
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = BAND;
    const ctx = cv.getContext("2d");
    const img = ctx.createImageData(W, BAND);
    const px = img.data;

    for (let y = 0; y < BAND; y++) {
      const base = skyBase(y);
      for (let x = 0; x < W; x++) {
        let [r, g, b] = base;
        const dsun = Math.hypot(x - SUN.x, y - SUN.y);
        const L = Math.exp(-dsun / 170);

        // nebula
        const n = N.fbm(x * 0.006, y * 0.006);
        const m = gauss(x, y, 265, 185, 85) * smooth(0.4, 0.7, n) * 0.9;
        const v = gauss(x, y, 430, 105, 95) * smooth(0.35, 0.7, n) * 0.9;
        const t = gauss(x, y, 505, 75, 60) * n;
        const red = gauss(x, y, 480, 310, 170) * 0.7 + gauss(x, y, 600, 250, 120) * 0.45 + gauss(x, y, 130, 280, 130) * 0.4;
        r += 200 * m + 70 * v + 30 * t + 185 * red * (0.6 + n * 0.6);
        g += 40 * m + 60 * v + 150 * t + 28 * red;
        b += 150 * m + 220 * v + 160 * t + 30 * red;

        // stars (denser in the nebula)
        if (y < 460) {
          const thr = 0.9978 - 0.004 * gauss(x, y, 470, 120, 110);
          const h = N.hash(x, y + 9999);
          if (h > thr) {
            const s = 255 * (h - thr) / (1 - thr) * smooth(460, 300, y);
            r += s; g += s; b += s;
          }
        }

        // left orange cloud column
        const edge = 150 + 170 * N.fbm(y * 0.007, 3.1, 4) - 0.12 * y;
        const tex = N.fbm(x * 0.009, y * 0.009, 4);
        let dens = smooth(edge + 50, edge - 50, x) * smooth(580, 430, y) * smooth(0.28, 0.55, tex + 0.2);
        if (dens > 0) {
          const lit = mix([95, 30, 20], [235, 125, 60], smooth(0.35, 0.75, tex));
          const hi = mix(lit, [255, 195, 130], smooth(0.62, 0.85, tex));
          const c = [hi[0] + 200 * L, hi[1] + 170 * L, hi[2] + 140 * L];
          [r, g, b] = mix([r, g, b], c, dens);
        }

        // dark mountains on the right
        const ridge = 475 + 70 * N.fbm(x * 0.006, 11.3, 4) - Math.max(0, x - 420) * 0.08;
        if (x > 330 && y > ridge && y < 640) {
          const md = smooth(330, 470, x) * smooth(ridge, ridge + 6, y);
          const shade = 0.7 + 0.5 * N.fbm(x * 0.03, y * 0.03, 3);
          [r, g, b] = mix([r, g, b], [34 * shade, 32 * shade, 40 * shade], md);
        }

        // cloud bank lit by the sun
        const bump = N.fbm(x * 0.013, 7.7, 4);
        const top = 250 + 110 * (1 - bump) - 40 * Math.exp(-((x - SUN.x) ** 2) / 20000);
        const tex2 = N.fbm(x * 0.011 + 40, y * 0.014, 4);
        dens = smooth(top - 8, top + 30, y) * smooth(490, 420, y) * smooth(20, 90, x) * smooth(680, 560, x) * smooth(0.25, 0.5, tex2 + 0.1);
        if (dens > 0) {
          const rim = Math.exp(-(y - top) / 22);
          let c = mix([70, 48, 56], [190, 145, 148], smooth(0.35, 0.8, tex2));
          c = c.map(v => v * (0.55 + 0.6 * tex2));
          c = [c[0] + 150 * L + 330 * rim * L, c[1] + 125 * L + 280 * rim * L, c[2] + 100 * L + 210 * rim * L];
          [r, g, b] = mix([r, g, b], c, dens);
        }

        // mist band
        const mist = smooth(440, 530, y) * smooth(700, 590, y) * (0.55 + 0.45 * N.fbm(x * 0.008, y * 0.02, 4));
        if (mist > 0) {
          const L2 = Math.exp(-dsun / 320) * 0.9;
          const c = [58 + 200 * L2, 46 + 150 * L2, 48 + 110 * L2];
          [r, g, b] = mix([r, g, b], c, mist * 0.9);
        }

        // lava field
        if (y > 600) {
          const dy = y - YH;
          let X = 4 * (x - W / 2) / dy;
          let Z = 4350 / dy;
          X += 0.45 * (N.fbm(X * 0.6, Z * 0.6, 3) - 0.5);
          Z += 0.45 * (N.fbm(X * 0.6 + 5, Z * 0.6 + 5, 3) - 0.5);
          const [d1, d2, id] = N.voronoi(X, Z);
          const e = (d2 - d1) * dy / 4;                 // crack distance in ~pixels
          const near = dy / 660;
          const ci = clamp(0.35 + 0.9 * N.fbm(X * 1.3 + 9, Z * 1.3, 3));
          const core = Math.exp(-((e / (0.6 + 1.6 * near)) ** 2)) * ci;
          const halo = Math.exp(-e / (4 + 14 * near)) * ci;

          const tone = 0.65 + 0.55 * N.fbm(x * 0.02, y * 0.035, 4);
          let plate = mix([52, 40, 40], [108, 92, 100], id * 0.8 + 0.1);
          plate = plate.map(c => c * tone);
          if (N.hash(x, y) > 0.985) plate = plate.map(c => c * 0.6);        // pits
          const burn = smooth(0, 10 + 30 * near, e);
          plate = mix([40, 18, 12], plate, 0.35 + 0.65 * burn);
          let gr = [
            plate[0] + 250 * halo + 255 * core,
            plate[1] + 80 * halo + 175 * core,
            plate[2] + 15 * halo + 70 * core
          ];
          const ga = smooth(600, 740, y);
          [r, g, b] = mix([r, g, b], gr, ga);
        }
        // horizon haze blending sky, mountains and lava field
        const haze = smooth(520, 600, y) * smooth(800, 640, y) * 0.75;
        if (haze > 0) [r, g, b] = mix([r, g, b], [64 + 60 * Math.exp(-dsun / 300), 50 + 40 * Math.exp(-dsun / 300), 50], haze);

        const k = (y * W + x) * 4;
        px[k] = r; px[k + 1] = g; px[k + 2] = b; px[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    // warm lava light spilling upward
    let grd = ctx.createLinearGradient(0, BAND, 0, 640);
    grd.addColorStop(0, "rgba(255,90,20,0.10)");
    grd.addColorStop(1, "rgba(255,90,20,0)");
    ctx.globalCompositeOperation = "screen";
    ctx.fillStyle = grd;
    ctx.fillRect(0, 640, W, BAND - 640);

    // sun rays
    const rays = document.createElement("canvas");
    rays.width = W; rays.height = BAND;
    const rc = rays.getContext("2d");
    for (let i = 0; i < 70; i++) {
      const a = N.hash(i, 1) * Math.PI * 2;
      const w = 0.004 + 0.02 * N.hash(i, 2);
      const len = 250 + 650 * N.hash(i, 3);
      const alpha = 0.12 + 0.35 * N.hash(i, 4);
      const lg = rc.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, len);
      lg.addColorStop(0, `rgba(255,245,225,${alpha})`);
      lg.addColorStop(0.4, `rgba(255,210,160,${alpha * 0.5})`);
      lg.addColorStop(1, "rgba(255,180,120,0)");
      rc.fillStyle = lg;
      rc.beginPath();
      rc.moveTo(SUN.x, SUN.y);
      rc.arc(SUN.x, SUN.y, len, a - w, a + w);
      rc.closePath();
      rc.fill();
    }
    ctx.filter = "blur(2px)";
    ctx.drawImage(rays, 0, 0);
    ctx.filter = "none";

    // sun glow
    grd = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 430);
    grd.addColorStop(0, "rgba(255,255,248,1)");
    grd.addColorStop(0.04, "rgba(255,250,225,0.95)");
    grd.addColorStop(0.14, "rgba(255,215,150,0.5)");
    grd.addColorStop(0.3, "rgba(255,160,90,0.22)");
    grd.addColorStop(0.6, "rgba(255,110,50,0.12)");
    grd.addColorStop(1, "rgba(255,90,40,0)");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, BAND);

    // bright stars
    for (let i = 0; i < 14; i++) {
      const sx = 120 + 600 * N.hash(i, 20), sy = 20 + 200 * N.hash(i, 21);
      if (Math.hypot(sx - 790, sy - 130) < 170) continue;
      const s = 3 + 6 * N.hash(i, 22);
      const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, s * 3);
      sg.addColorStop(0, "rgba(255,255,255,0.95)");
      sg.addColorStop(0.3, "rgba(210,220,255,0.4)");
      sg.addColorStop(1, "rgba(200,210,255,0)");
      ctx.fillStyle = sg;
      ctx.fillRect(sx - s * 3, sy - s * 3, s * 6, s * 6);
    }

    // planets (bright crescent = lit disc covered by an offset dark disc)
    ctx.globalCompositeOperation = "source-over";
    const crescent = (cx, cy, rad, ox, oy, rim, glow) => {
      ctx.save();
      ctx.shadowColor = glow;
      ctx.shadowBlur = rad * 0.35;
      ctx.fillStyle = rim;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#07060d";
      ctx.beginPath(); ctx.arc(cx + ox, cy + oy, rad * 0.985, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    };
    crescent(795, 120, 160, 12, -14, "#ff6a2a", "rgba(255,80,30,0.95)");
    crescent(283, 72, 52, 2, -9, "#ffd9b0", "rgba(255,190,140,0.9)");

    // vignette
    grd = ctx.createRadialGradient(W / 2, BAND * 0.45, BAND * 0.35, W / 2, BAND * 0.5, BAND * 0.85);
    grd.addColorStop(0, "rgba(0,0,0,0)");
    grd.addColorStop(1, "rgba(0,0,0,0.45)");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, BAND);
    return cv;
  }

  // ---------- typography ----------
  // Each title line: first letter larger (classic small-caps look).
  const LINE_STYLES = [
    { cap: 150, small: 118, track: 2 },
    { cap: 205, small: 142, track: 1 },
    { cap: 86, small: 78, track: 6 },
  ];

  function drawCapsLine(ctx, text, cx, baseline, st, maxW) {
    const chars = [...text];
    let scale = 1;
    const measure = () => chars.reduce((w, ch, i) => {
      ctx.font = `500 ${(i === 0 ? st.cap : st.small) * scale}px Cinzel`;
      return w + ctx.measureText(ch).width + st.track * scale;
    }, -st.track * scale);
    let total = measure();
    if (total > maxW) { scale = maxW / total; total = measure(); }

    let x = cx - total / 2;
    const grd = ctx.createLinearGradient(0, baseline - st.cap * scale * 0.72, 0, baseline);
    grd.addColorStop(0, "#fffaf0");
    grd.addColorStop(0.5, "#f6e3bd");
    grd.addColorStop(1, "#e2c28d");
    chars.forEach((ch, i) => {
      ctx.font = `500 ${(i === 0 ? st.cap : st.small) * scale}px Cinzel`;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.85)";
      ctx.shadowBlur = 14;
      ctx.shadowOffsetX = 4;
      ctx.shadowOffsetY = 5;
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(60,25,8,0.9)";
      ctx.strokeText(ch, x, baseline);
      ctx.restore();
      ctx.fillStyle = grd;
      ctx.fillText(ch, x, baseline);
      x += ctx.measureText(ch).width + st.track * scale;
    });
  }

  function drawCover(canvas, art, book) {
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(art, 0, 0);

    // title
    ctx.textBaseline = "alphabetic";
    const baselines = book.title.length >= 3 ? [640, 790, 872] : book.title.length === 2 ? [700, 850] : [790];
    const styles = book.title.length >= 3 ? LINE_STYLES : book.title.length === 2 ? LINE_STYLES.slice(0, 2) : [LINE_STYLES[1]];
    book.title.slice(0, 3).forEach((line, i) =>
      drawCapsLine(ctx, line.toLocaleUpperCase("tr"), W / 2 + 12, baselines[i], styles[i], W - 110));

    // bottom band
    const boxX = book.volume ? 668 : W;
    ctx.fillStyle = "#2a0e05";
    ctx.fillRect(0, BAND, W, H - BAND);
    let grd = ctx.createLinearGradient(0, 0, boxX, 0);
    grd.addColorStop(0, "#8e3b12");
    grd.addColorStop(0.3, "#cf7a35");
    grd.addColorStop(0.7, "#bb6526");
    grd.addColorStop(1, "#83360f");
    ctx.fillStyle = grd;
    ctx.fillRect(0, BAND + 8, boxX, H - BAND - 8);
    grd = ctx.createLinearGradient(0, BAND + 8, 0, H);
    grd.addColorStop(0, "rgba(255,220,160,0.25)");
    grd.addColorStop(0.35, "rgba(255,220,160,0)");
    grd.addColorStop(1, "rgba(40,10,0,0.35)");
    ctx.fillStyle = grd;
    ctx.fillRect(0, BAND + 8, boxX, H - BAND - 8);

    if (book.volume) {
      grd = ctx.createLinearGradient(boxX, 0, W, 0);
      grd.addColorStop(0, "#5c1109");
      grd.addColorStop(0.5, "#7d1d12");
      grd.addColorStop(1, "#5a0f08");
      ctx.fillStyle = grd;
      ctx.fillRect(boxX + 4, BAND + 8, W - boxX - 4, H - BAND - 8);
      ctx.font = "500 128px Cinzel";
      ctx.textAlign = "center";
      ctx.fillStyle = "#f7e8cc";
      ctx.shadowColor = "rgba(0,0,0,0.6)";
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;
      ctx.fillText(String(book.volume), boxX + (W - boxX) / 2 + 2, BAND + 132);
      ctx.textAlign = "left";
    }

    // author signature
    ctx.font = '66px "Pinyon Script"';
    ctx.fillStyle = "#fdf3e4";
    ctx.shadowColor = "rgba(60,20,0,0.7)";
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;
    const aw = ctx.measureText(book.author).width;
    ctx.fillText(book.author, Math.max(24, (boxX - aw) / 2 - 20), BAND + 118);
    ctx.shadowColor = "transparent";
  }

  // ---------- page wiring ----------
  const gallery = document.getElementById("gallery");
  const form = document.getElementById("editor");
  const params = new URLSearchParams(location.search);
  const solo = params.get("solo");
  if (solo !== null) document.body.classList.add("solo");

  let artCache = null;

  function readBooks() {
    const title = document.getElementById("f-title").value.split("\n").map(s => s.trim()).filter(Boolean);
    const author = document.getElementById("f-author").value.trim();
    const vols = document.getElementById("f-volumes").value.split(",").map(s => s.trim()).filter(Boolean);
    return (vols.length ? vols : [null]).map(volume => ({ title, author, volume }));
  }

  function render() {
    artCache = artCache || paintArt(7);
    gallery.innerHTML = "";
    let books = readBooks();
    if (solo !== null) books = books.filter(b => String(b.volume ?? "") === solo || solo === "");
    books.slice(0, solo !== null ? 1 : books.length).forEach(book => {
      const fig = document.createElement("figure");
      const canvas = document.createElement("canvas");
      drawCover(canvas, artCache, book);
      const name = `${book.title.join(" ")}${book.volume ? " " + book.volume : ""}`;
      const cap = document.createElement("figcaption");
      const span = document.createElement("span");
      span.textContent = name;
      const a = document.createElement("a");
      a.textContent = "Download PNG";
      a.href = "#";
      a.addEventListener("click", e => {
        e.preventDefault();
        const dl = document.createElement("a");
        dl.download = name.toLowerCase().replace(/\s+/g, "-") + ".png";
        dl.href = canvas.toDataURL("image/png");
        dl.click();
      });
      cap.append(span, a);
      fig.append(canvas, cap);
      gallery.append(fig);
    });
    document.body.dataset.ready = "1";
  }

  form.addEventListener("submit", e => { e.preventDefault(); render(); });

  Promise.all([
    document.fonts.load('500 100px "Cinzel"'),
    document.fonts.load('66px "Pinyon Script"'),
  ]).catch(() => {}).then(render);
})();
</script>
</body>
</html>
